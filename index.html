<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Cedarville+Cursive&display=swap" rel="stylesheet">
 <link>
</head>
<body>
    <main>
     <div class="calculator">
        <input type="text" placeholder="0" id="inputBox" readonly>
        <div id="toggleButton">▼</div>
        <div id="extraOptions" class="btns">
          <div>
          <button>abs</button>
          <button>sin</button>
          <button>cos</button>
          <button>tan</button>
          </div>
           <div>
          <button>log₁₀(x)</button>
          <button>ln(x)</button>
          <button>√x</button>
          <button>π</button>
          </div>
        </div>
        <div class="btns">
          <div>
          <button class="operator">AC</button>
          <button class="operator">DEL</button>
          <button class="operator">%</button>
          <button class="operator">/</button>
        </div>
         <div>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="operator">*</button>
        </div>
         <div>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="operator">-</button>
        </div>
         <div>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="operator">+</button>
        </div>
         <div>  
          <button>0</button>
          <button>()</button>
          <button class="operator">.</button>
          <button class="equalBtn">=</button>
        </div>
        </div>
       
    </div>
    <script src="script.js"></script>
    </main>
</body>
</html>
